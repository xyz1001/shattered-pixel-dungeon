name: Build Desktop & Android Release

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Desktop Release JAR
        run: ./gradlew desktop:release

      - name: Build Android Release APK
        run: ./gradlew android:assembleRelease

      - name: Organize Artifacts
        run: |
          mkdir -p output/
          shopt -s nullglob
          jars=(desktop/build/libs/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "Desktop JAR not found"
            exit 1
          fi
          cp "${jars[@]}" output/

          mapfile -t apks < <(find android/build/outputs/apk/ -type f -name "*.apk")
          if [ ${#apks[@]} -eq 0 ]; then
            echo "Android APK not found"
            exit 1
          fi
          cp "${apks[@]}" output/

      - name: Upload Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredPD-Builds
          path: output/

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
